name: Mac app checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-checks:
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - run: ./scripts/test-macos.sh
      - run: node --test tests/site.test.mjs
      - run: python3 tests/release-gates.py
      - run: python3 scripts/check-source.py
      - name: Scan dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./cmd/socprint-macos
      - name: Build development universal app and DMG
        run: MODE=development ./scripts/build-macos-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SimplyPrint-at-SoC-Universal-Development
          path: |
            dist/SimplyPrint-at-SoC-Universal-Development.dmg
            dist/SimplyPrint-at-SoC-Universal-Development.dmg.sha256
            docs/RELEASE-READINESS.md
